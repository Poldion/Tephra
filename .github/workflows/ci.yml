# GitHub Actions: format check, Clippy and tests on Linux and Windows, analysis and build of the app,
# the app test on Linux, license and advisory check.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

  app:
    name: App (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: ubuntu-latest
            target: linux
          - os: ubuntu-latest
            target: apk
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'apk' && 'aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android' || '' }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v5
        if: matrix.target == 'apk'
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Linux build dependencies
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - name: Packages
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Build
        run: flutter build ${{ matrix.target }} --debug
      # Drives the real app against the SSH test server: create a vault, connect, type, lock and unlock.
      - name: App test
        if: matrix.target == 'linux'
        working-directory: ${{ github.workspace }}
        timeout-minutes: 20
        run: |
          sudo apt-get install -y xvfb fonts-dejavu-core
          cargo build -p tephra-ssh --features testing --example test_server
          ./target/debug/examples/test_server > "$RUNNER_TEMP/server.txt" &
          for attempt in $(seq 50); do grep -q '^port=' "$RUNNER_TEMP/server.txt" && break; sleep 0.2; done
          port="$(sed -n 's/^port=//p' "$RUNNER_TEMP/server.txt")"
          mkdir -p "$RUNNER_TEMP/shots"
          cd app
          app_test() {
            rm -rf "$RUNNER_TEMP/vault"
            TEPHRA_VAULT="$RUNNER_TEMP/vault/vault.tephra" xvfb-run -a -s "-screen 0 1280x800x24" \
              flutter test integration_test/app_test.dart -d linux --reporter expanded \
              --dart-define=TEPHRA_TEST_PORT="$port" --dart-define=TEPHRA_TEST_SHOTS="$RUNNER_TEMP/shots"
          }
          # Narrowing down why the app ends in the middle of the test on Linux: keep what a crash leaves
          # behind, then try again with SIGPIPE ignored.
          ulimit -c unlimited
          sudo sysctl -w kernel.core_pattern="$RUNNER_TEMP/core.%e.signal-%s" > /dev/null
          if ! app_test; then
            ls -l "$RUNNER_TEMP"/core.* 2>/dev/null || echo "No core dump: the app was not killed by a crash signal."
            sudo dmesg | tail -n 15
            trap '' PIPE
            if app_test; then echo "The test passes when SIGPIPE is ignored."; else echo "It fails with SIGPIPE ignored as well."; fi
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        if: matrix.target == 'linux' && always()
        with:
          name: app-test-linux
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore

  deny:
    name: Licenses and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: "1.90.0"
          command: check
          arguments: --locked
