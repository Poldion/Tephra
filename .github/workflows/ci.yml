# GitHub Actions: format check, Clippy and tests on Linux and Windows, analysis and build of the app,
# the app test on Linux, license and advisory check.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

  app:
    name: App (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: ubuntu-latest
            target: linux
          - os: ubuntu-latest
            target: apk
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'apk' && 'aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android' || '' }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v5
        if: matrix.target == 'apk'
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Linux build dependencies
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - name: Packages
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Tests without a device
        run: flutter test test
      - name: Build
        run: flutter build ${{ matrix.target }} --debug
      # Drives the real app against the SSH test server: create a vault, connect, type, lock and unlock. Then it
      # uploads the vault to a sync server, and the command line plays the second device that fetches it.
      - name: App test
        if: matrix.target == 'linux'
        working-directory: ${{ github.workspace }}
        timeout-minutes: 20
        run: |
          sudo apt-get install -y xvfb fonts-dejavu-core
          cargo build -p tephra-ssh --features testing --example test_server
          cargo build -p tephra-server -p tephra-cli
          ./target/debug/examples/test_server > "$RUNNER_TEMP/server.txt" &
          ./target/debug/tephra-server --db "$RUNNER_TEMP/sync.sqlite" --bind 127.0.0.2:8790 --registration open &
          for attempt in $(seq 50); do grep -q '^port=' "$RUNNER_TEMP/server.txt" && break; sleep 0.2; done
          port="$(sed -n 's/^port=//p' "$RUNNER_TEMP/server.txt")"
          mkdir -p "$RUNNER_TEMP/shots"
          cd app
          TEPHRA_VAULT="$RUNNER_TEMP/vault/vault.tephra" xvfb-run -a -s "-screen 0 1280x800x24" \
            flutter test integration_test/app_test.dart -d linux --reporter expanded \
            --dart-define=TEPHRA_TEST_PORT="$port" --dart-define=TEPHRA_TEST_SHOTS="$RUNNER_TEMP/shots" \
            --dart-define=TEPHRA_TEST_SYNC=http://127.0.0.2:8790 \
            --dart-define=TEPHRA_TEST_CLI="$GITHUB_WORKSPACE/target/debug/tephra"
          cd ..
          export TEPHRA_VAULT="$RUNNER_TEMP/second/vault.tephra" TEPHRA_PASSWORD="ein langes Master-Passwort"
          if ./target/debug/tephra sync join http://127.0.0.2:8790 tester; then echo "plain http was accepted without --allow-http"; exit 1; fi
          ./target/debug/tephra sync join --allow-http http://127.0.0.2:8790 tester
          ./target/debug/tephra host list | grep Testserver
      # tephra daemon as on a server: without a terminal, with the password from a file, ended by SIGTERM.
      - name: Service without a terminal
        if: matrix.target == 'linux'
        working-directory: ${{ github.workspace }}
        timeout-minutes: 5
        run: |
          export TEPHRA_VAULT="$RUNNER_TEMP/vault/vault.tephra"
          token="$(TEPHRA_PASSWORD='ein langes Master-Passwort' ./target/debug/tephra mcp add-client ci | grep -o 'tephramcp_[0-9a-f]*')"
          secret="$RUNNER_TEMP/master-password"
          printf '%s' 'ein langes Master-Passwort' > "$secret"
          chmod 644 "$secret"
          if TEPHRA_PASSWORD_FILE="$secret" ./target/debug/tephra daemon < /dev/null; then
            echo "a password file readable by others was accepted"; exit 1
          fi
          chmod 600 "$secret"
          TEPHRA_PASSWORD_FILE="$secret" ./target/debug/tephra daemon < /dev/null 2> "$RUNNER_TEMP/daemon.log" &
          daemon=$!
          for attempt in $(seq 50); do grep -q 'Dienst läuft' "$RUNNER_TEMP/daemon.log" && break; sleep 0.2; done
          request='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}'
          reply="$({ printf '%s\n' "$request"; sleep 3; } | TEPHRA_MCP_TOKEN="$token" timeout 20 ./target/debug/tephra mcp serve)"
          echo "$reply" | grep -q '"serverInfo"'
          kill -TERM "$daemon"
          wait "$daemon"
          cat "$RUNNER_TEMP/daemon.log"
          grep -q 'Kein Terminal' "$RUNNER_TEMP/daemon.log"
          grep -q 'MCP-Client „ci“ getrennt' "$RUNNER_TEMP/daemon.log"
      - uses: actions/upload-artifact@v7
        if: matrix.target == 'linux' && always()
        with:
          name: app-test-linux
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore

  deny:
    name: Licenses and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: "1.90.0"
          command: check
          arguments: --locked
