# Builds the programs for every published release and attaches them to it: the app, command line and
# sync server for Windows, command line and sync server for Linux, and the signed Android app.
#
# Started by hand (workflow_dispatch) it only tries the build: the files are kept as workflow
# artifacts and nothing is attached to a release.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Tag of the release, or "dev" for a run started by hand. File names use it without the leading "v".
  TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || 'dev' }}

defaults:
  run:
    shell: bash

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Command line and sync server
        run: cargo build --release --locked -p tephra-cli -p tephra-server
      - name: App
        working-directory: app
        run: flutter build windows --release
      - name: Package
        run: |
          name="Tephra-${TAG#v}-windows-x64"
          mkdir -p "dist/$name"
          cp -r app/build/windows/x64/runner/Release/. "dist/$name/"
          cp target/release/tephra.exe target/release/tephra-server.exe LICENSE THIRD_PARTY_NOTICES.md "dist/$name/"
          # The C++ runtime the programs need, so that nothing has to be installed first.
          for dll in msvcp140.dll vcruntime140.dll vcruntime140_1.dll; do
            cp "$(cygpath "$SYSTEMROOT")/System32/$dll" "dist/$name/"
          done
          "dist/$name/tephra.exe" --version
          cd dist
          7z a -tzip "$name.zip" "$name" > /dev/null
          sha256sum "$name.zip" > "$name.zip.sha256"
          rm -r "$name"
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'release'
        with:
          name: windows
          path: dist/*

  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Build tools for static linking
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Command line and sync server
        # Statically linked, so the programs run on any distribution regardless of its C library.
        run: cargo build --release --locked --target x86_64-unknown-linux-musl -p tephra-cli -p tephra-server
      - name: Package
        run: |
          name="Tephra-${TAG#v}-linux-x64"
          mkdir -p "dist/$name"
          cp target/x86_64-unknown-linux-musl/release/tephra target/x86_64-unknown-linux-musl/release/tephra-server \
            LICENSE THIRD_PARTY_NOTICES.md deploy/tephra-server.service "dist/$name/"
          "dist/$name/tephra" --version
          "dist/$name/tephra-server" --version
          cd dist
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          rm -r "$name"
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'release'
        with:
          name: linux
          path: dist/*

  android:
    name: Android
    runs-on: ubuntu-latest
    env:
      # SHA-256 of the signing certificate. A build signed with anything else is not released.
      CERTIFICATE: 6a50b96c4c679bd99ac2fe7c8adecff62722efeccbd3f57570548d0f4cd36de9
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.TEPHRA_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "The signing key is missing (secret TEPHRA_KEYSTORE_BASE64)."; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build signed app
        working-directory: app
        env:
          TEPHRA_KEYSTORE_PASSWORD: ${{ secrets.TEPHRA_KEYSTORE_PASSWORD }}
          TEPHRA_KEY_ALIAS: ${{ secrets.TEPHRA_KEY_ALIAS }}
          TEPHRA_KEY_PASSWORD: ${{ secrets.TEPHRA_KEY_PASSWORD }}
        run: TEPHRA_KEYSTORE="$RUNNER_TEMP/release.jks" flutter build apk --release
      - name: Check signature and package
        run: |
          apk="Tephra-${TAG#v}.apk"
          mkdir dist
          cp app/build/app/outputs/flutter-apk/app-release.apk "dist/$apk"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          signed="$("$apksigner" verify --print-certs "dist/$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          test "$signed" = "$CERTIFICATE" || { echo "Signed with an unexpected certificate: $signed"; exit 1; }
          cd dist
          sha256sum "$apk" > "$apk.sha256"
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'release'
        with:
          name: android
          path: dist/*
