# Builds the programs for every published release and attaches them to it:
#
#   Windows   installer (app, command line, sync server) and the same as a portable zip
#   Linux     the app as a Debian package and as an AppImage; command line and sync server, statically linked
#   Android   the signed app
#   Server    the sync server as a container image for amd64 and arm64 (ghcr.io/poldion/tephra-server)
#
# Started by hand (workflow_dispatch) it only tries the build: the files are kept as workflow
# artifacts and nothing is attached to a release.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Tag of the release, or "dev" for a run started by hand. File names use it without the leading "v".
  TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || 'dev' }}

defaults:
  run:
    shell: bash

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Command line and sync server
        run: cargo build --release --locked -p tephra-cli -p tephra-server
      - name: App
        working-directory: app
        run: flutter build windows --release
      - name: Collect the programs
        run: |
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
          name="Tephra-${TAG#v}-windows-x64"
          mkdir -p "dist/$name"
          cp -r app/build/windows/x64/runner/Release/. "dist/$name/"
          cp target/release/tephra.exe target/release/tephra-server.exe LICENSE THIRD_PARTY_NOTICES.md "dist/$name/"
          # The C++ runtime the programs need, so that nothing has to be installed first.
          for dll in msvcp140.dll vcruntime140.dll vcruntime140_1.dll; do
            cp "$(cygpath "$SYSTEMROOT")/System32/$dll" "dist/$name/"
          done
          "dist/$name/tephra.exe" --version
      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          $source = Join-Path $PWD "dist\Tephra-$($env:VERSION)-windows-x64"
          $output = Join-Path $PWD "dist"
          & $iscc "/DAppVersion=$($env:VERSION)" "/DSourceDir=$source" "/DOutputDir=$output" packaging\windows\tephra.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Try the installer
        shell: pwsh
        run: |
          # Install silently, check that the programs are there and in the PATH, then uninstall again.
          $setup = "dist\Tephra-$($env:VERSION)-windows-x64-setup.exe"
          $target = Join-Path $env:RUNNER_TEMP "tephra-install"
          Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$target", "/TASKS=addtopath" -Wait
          & "$target\tephra.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "The installed command line does not run." }
          if (-not (Test-Path "$target\tephra-app.exe")) { throw "The app is missing after installing." }
          if ([Environment]::GetEnvironmentVariable("Path", "User") -notlike "*$target*") { throw "The PATH was not extended." }
          Start-Process "$target\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          foreach ($i in 1..30) { if (-not (Test-Path "$target\tephra.exe")) { break }; Start-Sleep -Seconds 1 }
          if (Test-Path "$target\tephra.exe") { throw "The programs are still there after uninstalling." }
          if ([Environment]::GetEnvironmentVariable("Path", "User") -like "*$target*") { throw "The PATH was not cleaned up." }
      - name: Package
        run: |
          cd dist
          name="Tephra-$VERSION-windows-x64"
          7z a -tzip "$name.zip" "$name" > /dev/null
          rm -r "$name"
          for file in *.zip *.exe; do sha256sum "$file" > "$file.sha256"; done
          ls -l
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'release'
        with:
          name: windows
          path: dist/*

  linux-app:
    name: Linux app
    # The oldest system on offer, so that the packages also run on older distributions
    # (Ubuntu from 22.04, Debian from 12).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev xvfb desktop-file-utils
      - name: Command line and sync server
        run: cargo build --release --locked -p tephra-cli -p tephra-server
      - name: App
        working-directory: app
        run: flutter build linux --release
      - name: Packages
        run: |
          version="${TAG#v}"
          # A Debian version has to start with a digit.
          debian="$version"; [ "$debian" = dev ] && debian=0.0.0
          bundle=app/build/linux/x64/release/bundle
          desktop-file-validate packaging/linux/io.github.poldion.tephra.desktop
          sh packaging/linux/build-deb.sh "$debian" "$bundle" target/release dist
          tool="$RUNNER_TEMP/appimagetool"
          curl -sSfL -o "$tool" https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $tool" | sha256sum -c -
          chmod +x "$tool"
          sh packaging/linux/build-appimage.sh "$version" "$bundle" "$tool" "dist/Tephra-$version-x86_64.AppImage"
      - name: Try the packages
        run: |
          sudo apt-get install -y ./dist/tephra_*_amd64.deb
          tephra --version
          tephra-server --version
          # The app has no way to end by itself: it is fine if it is still running after ten seconds.
          alive() { code=0; xvfb-run -a timeout 10 "$@" || code=$?; test "$code" -eq 124; }
          alive tephra-app
          alive ./dist/Tephra-*.AppImage --appimage-extract-and-run
          cd dist
          for file in *.deb *.AppImage; do sha256sum "$file" > "$file.sha256"; done
          ls -l
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'release'
        with:
          name: linux-app
          path: dist/*

  linux:
    name: Linux command line
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Build tools for static linking
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Command line and sync server
        # Statically linked, so the programs run on any distribution regardless of its C library.
        run: cargo build --release --locked --target x86_64-unknown-linux-musl -p tephra-cli -p tephra-server
      - name: Package
        run: |
          name="Tephra-${TAG#v}-linux-x64"
          mkdir -p "dist/$name"
          cp target/x86_64-unknown-linux-musl/release/tephra target/x86_64-unknown-linux-musl/release/tephra-server \
            LICENSE THIRD_PARTY_NOTICES.md deploy/tephra-server.service "dist/$name/"
          "dist/$name/tephra" --version
          "dist/$name/tephra-server" --version
          cd dist
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          rm -r "$name"
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'release'
        with:
          name: linux
          path: dist/*

  android:
    name: Android
    runs-on: ubuntu-latest
    env:
      # SHA-256 of the signing certificate. A build signed with anything else is not released.
      CERTIFICATE: 6a50b96c4c679bd99ac2fe7c8adecff62722efeccbd3f57570548d0f4cd36de9
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.TEPHRA_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "The signing key is missing (secret TEPHRA_KEYSTORE_BASE64)."; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build signed app
        working-directory: app
        env:
          TEPHRA_KEYSTORE_PASSWORD: ${{ secrets.TEPHRA_KEYSTORE_PASSWORD }}
          TEPHRA_KEY_ALIAS: ${{ secrets.TEPHRA_KEY_ALIAS }}
          TEPHRA_KEY_PASSWORD: ${{ secrets.TEPHRA_KEY_PASSWORD }}
        run: TEPHRA_KEYSTORE="$RUNNER_TEMP/release.jks" flutter build apk --release
      - name: Check signature and package
        run: |
          apk="Tephra-${TAG#v}.apk"
          mkdir dist
          cp app/build/app/outputs/flutter-apk/app-release.apk "dist/$apk"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          # The wording of the line differs between versions of apksigner; only the digest matters.
          "$apksigner" verify --print-certs "dist/$apk" | tee certs.txt
          signed="$(grep -oE 'certificate SHA-256 digest: [0-9a-f]{64}' certs.txt | awk '{print $NF}' | sort -u)"
          test "$signed" = "$CERTIFICATE" || { echo "Signed with an unexpected certificate: $signed"; exit 1; }
          cd dist
          sha256sum "$apk" > "$apk.sha256"
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'release'
        with:
          name: android
          path: dist/*

  image:
    name: Server image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      IMAGE: ghcr.io/poldion/tephra-server
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -f deploy/Dockerfile --build-arg VERSION="${TAG#v}" -t tephra-server:built .
      - name: Try the image
        run: |
          # Start the server as the Compose file does and see whether it answers and can create an invite code.
          docker run -d --name sync --read-only --tmpfs /tmp --cap-drop ALL -p 127.0.0.1:8787:8787 \
            -e TEPHRA_SERVER_REGISTRATION=invite tephra-server:built
          for attempt in $(seq 50); do curl -sf http://127.0.0.1:8787/healthz && break; sleep 0.2; done
          curl -sf http://127.0.0.1:8787/healthz
          docker exec sync tephra-server --version
          docker exec sync tephra-server invite
          docker stop sync
          docker logs sync
      - name: Push
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag tephra-server:built "$IMAGE:${TAG#v}-${{ matrix.arch }}"
          docker push "$IMAGE:${TAG#v}-${{ matrix.arch }}"

  image-manifest:
    name: Server image
    # Joins the images of both architectures under the version and under "latest".
    if: github.event_name == 'release'
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/poldion/tephra-server
    steps:
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          version="${TAG#v}"
          docker buildx imagetools create -t "$IMAGE:$version" -t "$IMAGE:latest" \
            "$IMAGE:$version-amd64" "$IMAGE:$version-arm64"
          docker buildx imagetools inspect "$IMAGE:$version"
