[package]
name = "tephra-sync"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "sync", "time", "macros"] }
tracing = "0.1.44"
tephra-core.workspace = true
tephra-crypto.workspace = true
tephra-sync-proto.workspace = true
tephra-vault.workspace = true
uuid = "1.29.3"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full"] }
tephra-server = { path = "../tephra-server", features = ["testing"] }
tephra-vault = { path = "../tephra-vault", features = ["testing"] }

[lints]
workspace = true
