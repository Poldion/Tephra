[package]
name = "tephra-transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
boringtun = "0.7.1"
smoltcp = { version = "0.14.0", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-udp", "proto-dns", "socket-dns", "async", "socket-tcp-cubic", "assembler-max-segment-count-32", "dns-max-server-count-4", "dns-max-result-count-4", "iface-max-addr-count-4"] }
socket2 = "0.6.5"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["net", "rt", "sync", "time", "io-util", "macros"] }
tracing = "0.1.44"
tephra-crypto.workspace = true
tephra-model.workspace = true
zeroize = "1.9.2"

[dev-dependencies]
proptest = "1.12.0"
tokio = { version = "1.54.1", features = ["full", "test-util"] }

[lints]
workspace = true
