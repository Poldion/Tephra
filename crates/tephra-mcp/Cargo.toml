[package]
name = "tephra-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1.92"
rmcp = { version = "3.11.0", features = ["server", "transport-io", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "sync", "time", "macros", "io-util"] }
tracing = "0.1.44"
tephra-core.workspace = true
tephra-crypto.workspace = true
uuid = { version = "1.29.3", features = ["v4"] }
zeroize = "1.9.2"

[dev-dependencies]
proptest = "1.12.0"
rmcp = { version = "3.11.0", features = ["client"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full"] }
tephra-ssh = { path = "../tephra-ssh", features = ["testing"] }
tephra-vault = { path = "../tephra-vault", features = ["testing"] }

[lints]
workspace = true
