[package]
name = "tephra-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1.92"
clap = { version = "4.6.8", features = ["derive", "env"] }
crossterm = "0.29.0"
rpassword = "7.5.5"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tephra-core.workspace = true
tephra-crypto.workspace = true
tephra-mcp.workspace = true
tephra-ssh.workspace = true
tephra-sync.workspace = true
tephra-transport.workspace = true
tephra-vault.workspace = true
uuid = "1.29.3"

[[bin]]
name = "tephra"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3.27.0"
tephra-vault = { path = "../tephra-vault", features = ["testing"] }

[lints]
workspace = true
