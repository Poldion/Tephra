[package]
name = "tephra-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
clap = { version = "4.6.8", features = ["derive", "env"] }
hex = "0.4.3"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "signal"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tephra-crypto.workspace = true
tephra-sync-proto.workspace = true
uuid = { version = "1.29.3", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.27.0"

[features]
# Lässt die bewusst schwachen Passwortparameter für automatisierte Tests zu.
testing = []

[lints]
workspace = true
