[package]
name = "tephra-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1.92"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "sync", "time", "macros"] }
tracing = "0.1.44"
tephra-crypto.workspace = true
tephra-model.workspace = true
tephra-ssh.workspace = true
tephra-transport.workspace = true
tephra-vault.workspace = true
uuid = { version = "1.29.3", features = ["v5"] }

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full"] }
tephra-ssh = { path = "../tephra-ssh", features = ["testing"] }
tephra-vault = { path = "../tephra-vault", features = ["testing"] }

[lints]
workspace = true
